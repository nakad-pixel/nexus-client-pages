name: Validate Workflows

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML syntax (all workflow files)
        run: |
          status=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            echo "Checking $f"
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1])); print('  OK')" "$f" || { echo "::error file=$f::Invalid YAML syntax"; status=1; }
          done
          exit $status

      - name: Lint workflow logic with actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
