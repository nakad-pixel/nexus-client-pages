name: Auto-Deploy to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed client slug
        id: detect
        shell: bash
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep "^clients/" | grep -v "_template" | head -1 || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            SLUG=$(echo "$CHANGED" | awk -F/ '{print $2}')
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Netlify CLI
        if: steps.detect.outputs.skip != 'true'
        shell: bash
        run: npm install -g netlify-cli@17

      - name: Run deploy script
        if: steps.detect.outputs.skip != 'true'
        shell: bash
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          chmod +x scripts/deploy.sh
          bash scripts/deploy.sh "${{ steps.detect.outputs.slug }}" "$NETLIFY_TOKEN"

      - name: Ping Activepieces
        if: steps.detect.outputs.skip != 'true'
        shell: bash
        env:
          AP_WEBHOOK_URL: ${{ secrets.AP_WEBHOOK_URL }}
          SLUG: ${{ steps.detect.outputs.slug }}
        run: |
          if [ -z "$AP_WEBHOOK_URL" ]; then
            echo "AP_WEBHOOK_URL not set, skipping."
            exit 0
          fi
          LIVE_URL="https://nexus-${SLUG}.netlify.app"
          META_FILE="clients/${SLUG}/lead-meta.json"
          if [ -f "$META_FILE" ]; then
            PAYLOAD=$(jq -c --arg slug "$SLUG" --arg live_url "$LIVE_URL" '. + {event:"client_deployed", slug:$slug, live_url:$live_url}' "$META_FILE")
          else
            PAYLOAD=$(jq -n -c --arg slug "$SLUG" --arg live_url "$LIVE_URL" '{event:"client_deployed", slug:$slug, live_url:$live_url}')
          fi
          curl -sf -X POST "$AP_WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD" || true
