name: Auto-Deploy → Netlify + Activepieces

on:
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - 'demo-restaurant/**'
      - 'demo-salon/**'
      - 'demo-realestate/**'
      - 'shared-assets/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      client_slug: ${{ steps.detect.outputs.client_slug }}
      base_dir: ${{ steps.detect.outputs.base_dir }}
      netlify_url: ${{ steps.enrich.outputs.netlify_url }}
      netlify_site: ${{ steps.enrich.outputs.netlify_site }}
      niche: ${{ steps.enrich.outputs.niche }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed client folder
        id: detect
        run: |
          CHANGED_PATH=$(git diff --name-only HEAD~1 HEAD \
            | grep -E '^(clients/|demo-restaurant/|demo-salon/|demo-realestate/)' \
            | head -1)

          if [ -z "$CHANGED_PATH" ]; then
            echo "client_slug=" >> $GITHUB_OUTPUT
            echo "base_dir=" >> $GITHUB_OUTPUT
            exit 0
          fi

          if echo "$CHANGED_PATH" | grep -q '^clients/'; then
            CLIENT_SLUG=$(echo "$CHANGED_PATH" | cut -d'/' -f2)
            BASE_DIR="clients/${CLIENT_SLUG}"
          else
            CLIENT_SLUG=$(echo "$CHANGED_PATH" | cut -d'/' -f1)
            BASE_DIR="${CLIENT_SLUG}"
          fi

          if [ "$CLIENT_SLUG" = "_template" ]; then
            echo "client_slug=" >> $GITHUB_OUTPUT
            echo "base_dir=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "client_slug=$CLIENT_SLUG" >> $GITHUB_OUTPUT
          echo "base_dir=$BASE_DIR" >> $GITHUB_OUTPUT

      - name: Derive Netlify URL and niche
        id: enrich
        if: steps.detect.outputs.client_slug != ''
        run: |
          SLUG="${{ steps.detect.outputs.client_slug }}"
          NETLIFY_SITE="nexus-${SLUG}"
          NETLIFY_URL="https://${NETLIFY_SITE}.netlify.app"
          echo "netlify_url=$NETLIFY_URL" >> $GITHUB_OUTPUT
          echo "netlify_site=$NETLIFY_SITE" >> $GITHUB_OUTPUT

          NICHE="business"
          case "$SLUG" in
            *restaurant*|*food*|*cafe*|*dhaba*|*biryani*|*hotel*) NICHE="restaurant" ;;
            *salon*|*spa*|*beauty*|*hair*|*nail*|*glamour*)        NICHE="salon" ;;
            *real*estate*|*property*|*homes*|*realty*|*flat*|*villa*) NICHE="real-estate" ;;
            *gym*|*fitness*|*yoga*|*wellness*)                     NICHE="fitness" ;;
            *doctor*|*clinic*|*dental*|*health*|*hospital*)        NICHE="healthcare" ;;
            *school*|*college*|*academy*|*coaching*|*tutor*)       NICHE="education" ;;
            *shop*|*store*|*boutique*|*fashion*|*cloth*)           NICHE="retail" ;;
            *interior*|*design*|*architect*|*decor*)               NICHE="interior" ;;
          esac
          echo "niche=$NICHE" >> $GITHUB_OUTPUT

  deploy-netlify:
    needs: detect
    if: needs.detect.outputs.client_slug != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy client folder directly to Netlify
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          if [ -z "$NETLIFY_TOKEN" ]; then
            echo "NETLIFY_TOKEN not set — skipping Netlify deploy."
            exit 0
          fi

          SLUG="${{ needs.detect.outputs.client_slug }}"
          SITE_NAME="nexus-${SLUG}"

          case "$SLUG" in
            demo-*) SRC_DIR="${SLUG}" ;;
            *)      SRC_DIR="clients/${SLUG}" ;;
          esac

          # Look up site ID by name
          SITE_ID=$(curl -sf \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            "https://api.netlify.com/api/v1/sites?filter=all&per_page=100" \
            | python3 -c "import json,sys; sites=json.load(sys.stdin); m=[s['id'] for s in sites if s.get('name')=='$SITE_NAME']; print(m[0] if m else '')")

          if [ -z "$SITE_ID" ]; then
            echo "Site $SITE_NAME not found on Netlify — creating it..."
            SITE_ID=$(curl -sf \
              -X POST "https://api.netlify.com/api/v1/sites" \
              -H "Authorization: Bearer $NETLIFY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$SITE_NAME\"}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))")
            echo "Created site: $SITE_ID"
          fi

          echo "Deploying $SRC_DIR → $SITE_NAME ($SITE_ID)"

          # Zip the source directory
          cd "$SRC_DIR"
          zip -r /tmp/deploy.zip . -x "netlify.toml"
          cd -

          # Upload zip directly — no build system needed
          DEPLOY_RESP=$(curl -sf \
            -X POST "https://api.netlify.com/api/v1/sites/${SITE_ID}/deploys" \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/deploy.zip)

          DEPLOY_URL=$(echo "$DEPLOY_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('deploy_ssl_url') or d.get('ssl_url') or d.get('url','unknown'))")
          DEPLOY_STATE=$(echo "$DEPLOY_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('state','unknown'))")
          echo "Deploy state: $DEPLOY_STATE"
          echo "Deploy URL: $DEPLOY_URL"
          echo "Live at: https://${SITE_NAME}.netlify.app"

  deploy-github-pages:
    needs: detect
    if: needs.detect.outputs.client_slug != ''
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          for dir in clients demo-* shared-assets; do
            if [ -d "$dir" ]; then
              cp -r "$dir" _site/
            fi
          done
          ls -la _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [detect, deploy-netlify, deploy-github-pages]
    if: always() && needs.detect.outputs.client_slug != ''
    runs-on: ubuntu-latest
    steps:
      - name: Ping Activepieces — trigger sale pipeline
        run: |
          if [ -z "${{ secrets.AP_WEBHOOK_URL }}" ]; then
            echo "AP_WEBHOOK_URL not set — skipping Activepieces ping."
            exit 0
          fi
          curl -s -o /dev/null -w "Activepieces HTTP: %{http_code}\n" \
            -X POST "${{ secrets.AP_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"event":"client_deployed","client_slug":"${{ needs.detect.outputs.client_slug }}","netlify_url":"${{ needs.detect.outputs.netlify_url }}","niche":"${{ needs.detect.outputs.niche }}","repo":"${{ github.repository }}","commit_sha":"${{ github.sha }}","github_pages_url":"${{ needs.deploy-github-pages.outputs.page_url }}"}'
