name: Auto-Deploy to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed client
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep "^clients/" | head -1)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          SLUG=$(echo "$CHANGED" | cut -d'/' -f2)
          if [ "$SLUG" = "_template" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "src=clients/$SLUG" >> $GITHUB_OUTPUT
          echo "site=nexus-$SLUG" >> $GITHUB_OUTPUT

      - name: Validate client folder
        if: steps.detect.outputs.skip != 'true'
        run: |
          SRC="${{ steps.detect.outputs.src }}"
          if [ ! -f "$SRC/index.html" ]; then
            echo "ERROR: $SRC/index.html missing"
            exit 1
          fi
          echo "index.html found, size: $(wc -c < $SRC/index.html) bytes"

      - name: Install Netlify CLI
        if: steps.detect.outputs.skip != 'true'
        run: npm install -g netlify-cli@17

      - name: Create or find Netlify site
        if: steps.detect.outputs.skip != 'true'
        id: site
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          SITE_NAME: ${{ steps.detect.outputs.site }}
        run: |
          ALL=$(curl -sf -H "Authorization: Bearer $NETLIFY_TOKEN" "https://api.netlify.com/api/v1/sites?filter=all&per_page=100")
          SITE_ID=$(echo "$ALL" | python3 -c "
import json,sys
sites = json.load(sys.stdin)
name = '$SITE_NAME'
match = [s['id'] for s in sites if s.get('name') == name]
print(match[0] if match else '')
")
          if [ -z "$SITE_ID" ]; then
            echo "Creating site $SITE_NAME..."
            RESP=$(curl -sf -X POST "https://api.netlify.com/api/v1/sites"               -H "Authorization: Bearer $NETLIFY_TOKEN"               -H "Content-Type: application/json"               -d "{"name":"$SITE_NAME"}")
            SITE_ID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
            echo "Created: $SITE_ID"
          else
            echo "Found: $SITE_ID"
          fi
          echo "site_id=$SITE_ID" >> $GITHUB_OUTPUT

      - name: Deploy to Netlify via CLI
        if: steps.detect.outputs.skip != 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
        run: |
          SRC="${{ steps.detect.outputs.src }}"
          SITE_NAME="${{ steps.detect.outputs.site }}"
          echo "Deploying $SRC to $SITE_NAME (ID: $NETLIFY_SITE_ID)"
          netlify deploy --dir="$SRC" --prod --message="GH Actions ${{ github.sha }}"
          echo "Live at: https://$SITE_NAME.netlify.app"

      - name: Ping Activepieces
        if: steps.detect.outputs.skip != 'true' && secrets.AP_WEBHOOK_URL != ''
        env:
          AP_URL: ${{ secrets.AP_WEBHOOK_URL }}
          SLUG: ${{ steps.detect.outputs.slug }}
          SITE: ${{ steps.detect.outputs.site }}
        run: |
          if [ -z "$AP_URL" ]; then
            echo "AP_WEBHOOK_URL not set, skipping."
            exit 0
          fi
          curl -s -X POST "$AP_URL"             -H "Content-Type: application/json"             -d "{"event":"client_deployed","slug":"$SLUG","url":"https://$SITE.netlify.app","commit":"${{ github.sha }}"}"
