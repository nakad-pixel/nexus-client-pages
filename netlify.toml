# =================================================================
# ROOT netlify.toml — Nexus Client Pages
#
# CRITICAL: This file sets base="" which tells Netlify to use the
# repo root. This OVERRIDES any "Base directory" value stored in
# the Netlify site settings UI (including /opt/build).
#
# HOW NETLIFY RESOLVES CONFIG (order of precedence):
#   1. Netlify reads this root netlify.toml FIRST
#   2. The [build] base here overrides site settings
#   3. Per-client subfolder netlify.toml is read NEXT if base
#      points into a subdirectory
#
# For per-client sites: set base = "clients/<slug>" in the
# Netlify UI *or* rely on this root toml + the per-client toml.
# =================================================================

[build]
  base    = ""
  command = ""
  publish = "."

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Cache-Control          = "public, max-age=3600"
