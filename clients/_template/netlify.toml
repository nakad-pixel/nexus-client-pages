# AUTO-GENERATED per client by Nexus pipeline
# CLIENT_SLUG is replaced with actual slug at generation time

[build]
  base    = "clients/CLIENT_SLUG"
  command = ""
  publish = "."

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Cache-Control          = "public, max-age=3600"
