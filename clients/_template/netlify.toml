# =============================================================
# Nexus Web Systems — Per-Client Netlify Config TEMPLATE
# -------
# USAGE: This file is AUTO-GENERATED per client.
# Each clients/<client-slug>/netlify.toml uses publish = "."
# meaning Netlify serves that subfolder as a standalone site.
# =============================================================

[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"
