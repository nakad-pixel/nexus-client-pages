<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Demo — Client Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--accent:#6c63ff;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e8e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;}
    h1{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#6c63ff,#ff6584);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1rem;}
    p{color:#8888aa;margin-bottom:2rem;}
    .badge{display:inline-block;padding:0.4rem 1rem;border-radius:50px;background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.3);color:var(--accent);font-size:0.85rem;font-weight:600;}
  </style>
</head>
<body>
  <div>
    <div class="badge">🚀 Nexus Web Systems</div>
    <h1 style="margin-top:1.5rem;">Your Site Goes Here</h1>
    <p>This is a placeholder. Claude will replace this with your<br>custom Three.js landing page when the pipeline runs.</p>
  </div>
</body>
</html>
